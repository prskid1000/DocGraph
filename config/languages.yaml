languages:
  python:
    enabled: true
    parser: tree-sitter-python
    extensions:
      - .py
    features:
      - classes
      - functions
      - variables
      - imports
      - type_hints
      - decorators
  
  javascript:
    enabled: true
    parser: tree-sitter-javascript
    extensions:
      - .js
      - .jsx
    features:
      - classes
      - functions
      - variables
      - imports
      - jsx
  
  typescript:
    enabled: true
    parser: tree-sitter-typescript
    extensions:
      - .ts
      - .tsx
    features:
      - classes
      - functions
      - variables
      - imports
      - type_annotations
      - interfaces
  
  java:
    enabled: true
    parser: tree-sitter-java
    extensions:
      - .java
    features:
      - classes
      - methods
      - variables
      - imports
      - annotations
  
  kotlin:
    enabled: true
    parser: tree-sitter-kotlin
    extensions:
      - .kt
      - .kts
    features:
      - classes
      - functions
      - variables
      - imports
  
  html:
    enabled: true
    parser: html
    extensions:
      - .html
      - .htm
    features:
      - elements
      - ids
      - classes
      - links
  
  scss:
    enabled: true
    parser: scss
    extensions:
      - .scss
      - .sass
      - .css
    features:
      - selectors
      - variables
      - mixins
      - imports
