<title>DocGraph</title>

<!--
  DocGraph web UI. One self-contained file served by `docgraph host` at "/" (read fresh on every
  request, no build step, no external assets). Every call goes through api()/withRoot(), which
  appends ?root=<slug> for the active root.
  Pages (hash routes): #/graph  #/search  #/wiki  #/flows  #/changes  #/insights  #/ask  #/index
  Responsive: >=1180 three panes (drag handles) | 820-1180 detail becomes a drawer |
  <820 bottom tab bar, explorer drawer, detail bottom sheet | 44 px touch targets on coarse pointers.
  Graph engine: ForceAtlas2-style layout + label-propagation communities in a Web Worker,
  Canvas 2D render batched by colour, viewport-culled, labels capped by PageRank.
-->
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel2: #1f232c; --raised: #252a35; --hover: #232833;
  --border: #2a2f3a; --border-strong: #3a4150;
  --text: #e6e8eb; --muted: #9aa3b2; --faint: #6b7483;
  --accent: #7cc4ff; --accent-ink: #052034; --accent-soft: rgba(124,196,255,.12); --accent-line: rgba(124,196,255,.45);
  --ok: #4ade80; --ok-soft: rgba(74,222,128,.12);
  --warn: #fbbf24; --warn-soft: rgba(251,191,36,.12);
  --err: #f87171; --err-soft: rgba(248,113,113,.12);
  --violet: #b69cff; --pink: #f49ac1; --teal: #5eead4; --orange: #fdba74; --well: #0b0d11;
  --k-fn: #7cc4ff; --k-cls: #b69cff; --k-file: #4ade80; --k-var: #fdba74; --k-mod: #f49ac1;
  --shadow-pop: 0 12px 32px rgba(0,0,0,.45), 0 0 0 1px var(--border);
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --r-sm: 5px; --r: 7px; --r-lg: 11px;
  --topbar-h: 46px; --left-w: 284px; --right-w: 360px; --tabbar-h: 0px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f3f4f7; --raised: #ffffff; --hover: #eef0f4;
  --border: #e1e4ea; --border-strong: #cdd2db;
  --text: #171b22; --muted: #5a6371; --faint: #8a93a1;
  --accent: #1a73c9; --accent-ink: #ffffff; --accent-soft: rgba(26,115,201,.09); --accent-line: rgba(26,115,201,.45);
  --ok: #15803d; --ok-soft: rgba(21,128,61,.1); --warn: #b45309; --warn-soft: rgba(180,83,9,.1);
  --err: #c2322b; --err-soft: rgba(194,50,43,.09); --violet: #6d4ee0; --pink: #c0407a; --teal: #0f8f80; --orange: #c2610c; --well: #f8f9fb;
  --k-fn: #1a73c9; --k-cls: #6d4ee0; --k-file: #15803d; --k-var: #c2610c; --k-mod: #c0407a;
  --shadow-pop: 0 12px 32px rgba(15,20,30,.16), 0 0 0 1px var(--border);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f7; --panel: #ffffff; --panel2: #f3f4f7; --raised: #ffffff; --hover: #eef0f4;
    --border: #e1e4ea; --border-strong: #cdd2db; --text: #171b22; --muted: #5a6371; --faint: #8a93a1;
    --accent: #1a73c9; --accent-ink: #ffffff; --accent-soft: rgba(26,115,201,.09); --accent-line: rgba(26,115,201,.45);
    --ok: #15803d; --ok-soft: rgba(21,128,61,.1); --warn: #b45309; --warn-soft: rgba(180,83,9,.1);
    --err: #c2322b; --err-soft: rgba(194,50,43,.09); --violet: #6d4ee0; --pink: #c0407a; --teal: #0f8f80; --orange: #c2610c; --well: #f8f9fb;
    --k-fn: #1a73c9; --k-cls: #6d4ee0; --k-file: #15803d; --k-var: #c2610c; --k-mod: #c0407a;
    --shadow-pop: 0 12px 32px rgba(15,20,30,.16), 0 0 0 1px var(--border); color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
code, .mono { font-family: var(--mono); font-size: 11.5px; }
code { background: var(--panel2); border: 1px solid var(--border); padding: 0 4px; border-radius: 4px; }
kbd { font: 500 10.5px/1 var(--mono); padding: 2px 5px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px; color: var(--muted); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .grow { flex: 1; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; } .wrap { flex-wrap: wrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── Icons, buttons, inputs (manager.css kit) ── */
.ic { display: inline-flex; width: 16px; height: 16px; flex-shrink: 0; } .ic svg { width: 100%; height: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s; }
.btn:hover { background: var(--hover); border-color: var(--border-strong); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; } .btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--hover); color: var(--text); }
.btn.danger { background: var(--err-soft); color: var(--err); border-color: transparent; }
.btn.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.btn.icon { width: 28px; padding: 0; } .btn.sm { height: 24px; font-size: 12px; padding: 0 8px; } .btn.sm.icon { width: 24px; padding: 0; }
.btn.sm .ic { width: 14px; height: 14px; }
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { height: 24px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); border-radius: 5px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg .on { background: var(--raised) !important; color: var(--text) !important; box-shadow: 0 0 0 1px var(--border-strong); }
.seg.sm button { height: 20px; padding: 0 8px; font-size: 11.5px; }
.seg.full { display: flex; } .seg.full button { flex: 1; justify-content: center; }
.input { width: 100%; height: 30px; padding: 0 9px; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r); outline: none; min-width: 0;
  transition: border-color .12s, box-shadow .12s; }
.input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--faint); }
textarea.input { height: auto; padding: 8px 10px; resize: none; line-height: 1.45; }
.search-box { position: relative; } .search-box .ic { position: absolute; left: 9px; top: 7px; color: var(--faint); width: 15px; height: 15px; }
.search-box .input { padding-left: 30px; } .search-box kbd { position: absolute; right: 7px; top: 7px; }
.switch { position: relative; width: 28px; height: 16px; flex-shrink: 0; display: inline-block; }
.switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--border-strong); border-radius: 99px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); } .switch input:checked + span::after { transform: translateX(12px); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 19px; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 500;
  background: var(--panel2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.dot.live { box-shadow: 0 0 0 0 currentColor; animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 50%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.kind { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font: 600 10.5px/1 var(--mono); letter-spacing: .02em;
  background: color-mix(in srgb, var(--kc) 14%, transparent); color: var(--kc); flex-shrink: 0; }
.kind.fn { --kc: var(--k-fn); } .kind.cls { --kc: var(--k-cls); } .kind.file { --kc: var(--k-file); } .kind.var { --kc: var(--k-var); } .kind.mod { --kc: var(--k-mod); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg); }
.card-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
.card-head .sub { font-weight: 400; color: var(--faint); font-size: 12px; }
.card-body { padding: 12px 14px; }
.empty { padding: 28px 16px; text-align: center; color: var(--faint); font-size: 12.5px; }
.section-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 14px 0 6px; }
.bar { height: 5px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: var(--warn); }

/* ── Top bar (tc-appnav look) ── */
#app { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; }
.topbar { height: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(10px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  display: flex; align-items: center; gap: 10px; background: var(--panel); border-bottom: 1px solid var(--border); position: relative; z-index: 30; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; letter-spacing: -.01em; padding: 4px 6px 4px 2px; border-radius: 6px; white-space: nowrap; color: var(--text); }
.brand:hover { background: var(--hover); }
.mark { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--accent-ink);
  background: conic-gradient(from 210deg, #7cc4ff, #b69cff, #f49ac1, #7cc4ff); flex-shrink: 0; }
.mark .ic { width: 13px; height: 13px; }
.root-pick { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 8px 0 9px; border-radius: var(--r); border: 1px solid var(--border);
  background: var(--panel2); cursor: pointer; font-size: 12.5px; max-width: 220px; position: relative; }
.root-pick:hover { border-color: var(--border-strong); }
.root-pick .dot { color: var(--ok); }
.appswitch { position: relative; display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border); flex-shrink: 0; }
.appswitch .ind { position: absolute; top: 2px; bottom: 2px; left: 2px; width: 0; border-radius: 6px; pointer-events: none; background: var(--raised);
  box-shadow: 0 0 0 1px var(--border-strong), 0 1px 2px rgba(0,0,0,.18); transition: left .24s cubic-bezier(.3,.7,.2,1), width .24s cubic-bezier(.3,.7,.2,1); }
.appswitch a { position: relative; z-index: 1; height: 26px; padding: 0 11px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px;
  color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: color .15s; }
.appswitch a .ic { width: 15px; height: 15px; }
.appswitch a:hover { color: var(--text); }
.appswitch a[aria-current="page"] { color: var(--text); } .appswitch a[aria-current="page"] .ic { color: var(--accent); }
.top-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; min-width: 0; }
.cmd-btn { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 9px; border-radius: var(--r); border: 1px solid var(--border);
  background: var(--panel2); color: var(--faint); cursor: pointer; font-size: 12.5px; min-width: 200px; }
.cmd-btn:hover { border-color: var(--border-strong); color: var(--muted); }
.cmd-btn .lbl { flex: 1; text-align: left; }
.idx-status { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: var(--r); font-size: 12px; color: var(--muted);
  border: 1px solid var(--border); background: transparent; cursor: pointer; white-space: nowrap; }
.idx-status .dot { color: var(--warn); }
.idx-status:hover { background: var(--hover); }

/* ── Bottom tab bar (phones) ── */
.tabbar { display: none; }

/* ── Page frame ── */
#view { min-height: 0; overflow: hidden; position: relative; }
.page { height: 100%; overflow: auto; }
.page-inner { max-width: 1240px; margin: 0 auto; padding: 20px 24px 40px; }
.page-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.015em; }
.page-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.page-head .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

/* ── Graph page ── */
.gp { display: grid; grid-template-columns: var(--left-w) 1fr var(--right-w); height: 100%; min-height: 0; }
.pane { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
.pane.left { border-right: 1px solid var(--border); } .pane.right { border-left: 1px solid var(--border); }
.pane-tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.pane-tabs button { height: 30px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 500; cursor: pointer;
  border-radius: 6px 6px 0 0; display: inline-flex; align-items: center; gap: 6px; position: relative; }
.pane-tabs button:hover { color: var(--text); }
.pane-tabs button.on { color: var(--text); background: var(--panel2); box-shadow: inset 0 1px 0 var(--border), inset 1px 0 0 var(--border), inset -1px 0 0 var(--border); }
.pane-tabs button .ic { width: 14px; height: 14px; }
.pane-tabs .count { font: 500 10.5px var(--mono); color: var(--faint); }
.pane-body { flex: 1; min-height: 0; overflow: auto; }
.pane-pad { padding: 10px 12px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 24px; padding: 0 9px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; }
.res { display: flex; gap: 9px; padding: 8px 12px; cursor: pointer; border-left: 2px solid transparent; }
.res:hover { background: var(--hover); } .res.on { background: var(--accent-soft); border-left-color: var(--accent); }
.res .nm { font: 500 12.5px var(--mono); } .res .path { font-size: 11.5px; color: var(--faint); }
.res .score { font: 500 10.5px var(--mono); color: var(--faint); margin-left: auto; flex-shrink: 0; }
.toggle-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 12.5px; }
.toggle-row .n { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
.group { padding: 12px; border-bottom: 1px solid var(--border); }
.group:last-child { border-bottom: 0; }
.group h4 { margin: 0 0 2px; font-size: 12.5px; font-weight: 600; } .group p { margin: 0 0 9px; font-size: 11.5px; color: var(--faint); }

.stage { position: relative; min-width: 0; min-height: 0; background: var(--well);
  background-image: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--border) 70%, transparent) 1px, transparent 0); background-size: 22px 22px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas.layer { pointer-events: none; cursor: default; }
.stage canvas.dragging { cursor: grabbing; }
.float { position: absolute; z-index: 5; display: flex; gap: 6px; align-items: center; }
.float.tl { top: 12px; left: 12px; } .float.tr { top: 12px; right: 12px; } .float.bl { bottom: 12px; left: 12px; } .float.br { bottom: 12px; right: 12px; }
.glass { background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.toolstack { display: flex; flex-direction: column; padding: 3px; gap: 2px; }
.toolstack .btn { border-color: transparent; background: transparent; }
.toolstack .btn:hover { background: var(--hover); }
.toolstack .sep { height: 1px; background: var(--border); margin: 2px 4px; }
.sel-chip { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 10px; font-size: 12.5px; max-width: min(420px, 60vw); }
.sel-chip .nm { font: 500 12.5px var(--mono); }
.stats-strip { display: flex; gap: 14px; height: 28px; padding: 0 12px; align-items: center; font-size: 11.5px; color: var(--muted); }
.stats-strip b { color: var(--text); font: 600 11.5px var(--mono); }
.legend { padding: 8px 10px; display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; }
.layout-pill { height: 28px; padding: 0 10px; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.spinner { width: 12px; height: 12px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Detail pane */
.det-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.det-head .title { display: flex; gap: 8px; align-items: center; }
.det-head h2 { margin: 0; font: 600 15px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.det-head .loc { margin-top: 5px; font: 11.5px var(--mono); color: var(--faint); display: flex; gap: 6px; align-items: center; }
.det-head .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
.metrics > div { background: var(--panel); padding: 9px 10px; }
.metrics .v { font: 600 14px var(--mono); } .metrics .l { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.sig { font: 12px/1.5 var(--mono); background: var(--well); border: 1px solid var(--border); border-radius: var(--r); padding: 8px 10px; overflow-x: auto; white-space: pre; }
.doc { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.rel { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin: 0 -8px; border-radius: var(--r-sm); cursor: pointer; font: 12px var(--mono); }
.rel:hover { background: var(--hover); } .rel .meta { margin-left: auto; font-size: 11px; color: var(--faint); }
.code { font: 12px/1.6 var(--mono); background: var(--well); border: 1px solid var(--border); border-radius: var(--r); overflow: auto; }
.code .ln { display: flex; } .code .ln .no { width: 40px; flex-shrink: 0; text-align: right; padding-right: 12px; color: var(--faint); user-select: none; }

.sheet-handle { display: none; }

/* ── Tablet: detail becomes a drawer ── */
@media (max-width: 1180px) {

    transition: transform .22s cubic-bezier(.3,.7,.2,1); box-shadow: var(--shadow-pop); }
  .gp .pane.right.open { transform: none; }

}

/* ── Phone: bottom tab bar, drawers, bottom sheet ── */

  .gp .pane.left.open { transform: none; }

    border-radius: 16px 16px 0 0; }

  .sheet-handle { display: block; width: 38px; height: 5px; border-radius: 99px; background: var(--border-strong); margin: 8px auto 0; flex-shrink: 0; cursor: grab; }

  .wk { grid-template-columns: 1fr; } .wk-nav { display: none; } .wk-nav.open { display: block; position: absolute; inset: 0; z-index: 20; }

  .tbl .hide-sm { display: none; }

  .palette { top: 8px; }
  .hit .snip { display: none; }
}

function startLayout() {

  const tiles = [...G.want].map(k => G.tiles.get(k)).filter(t => t && t.lod === 0);
  if (!tiles.length) { toast('Zoom in to the symbol level to refine the local layout'); return; }
  const idx = new Map(), P = [], pin = [], refs = [];
  for (const t of tiles) {
    const b = tileBounds(t), m = (b.x1 - b.x0) * 0.12;
    for (let i = 0; i < t.n; i++) {
      idx.set(t.ids[i], refs.length); refs.push([t, i]); P.push(t.x[i], t.y[i]);
      pin.push(t.x[i] < b.x0 + m || t.x[i] > b.x1 - m || t.y[i] < b.y0 + m || t.y[i] > b.y1 - m || t.kind[i] === 0 ? 1 : 0);

    for (let j = 0; j < refs.length; j++) { const [t, i] = refs[j]; t.x[i] = pos[j * 2]; t.y[i] = pos[j * 2 + 1]; t.ver = 0; }

}

/* Desktop drag handles for the two side panes (persisted per viewer) */

  const KEY = 'docgraph.layout.v2', saved = lsGet(KEY, {}), gp = $('#gp');

  if (saved.right) gp.style.setProperty('--right-w', saved.right + 'px');

    h.addEventListener('pointerdown', e => {

      const pane = h.parentElement, startX = e.clientX, startW = pane.getBoundingClientRect().width;
      const move = ev => { const w = side === 'right' ? startW + (ev.clientX - startX) : startW - (ev.clientX - startX); gp.style.setProperty(varName, Math.max(min, Math.min(max, w)) + 'px'); };
      const stop = () => {

        h.classList.remove('dragging'); document.body.classList.remove('resizing');
        saved[key] = Math.round(pane.getBoundingClientRect().width); lsSet(KEY, saved);

async function runSearch() {

/* Cypher console (Search → Cypher and the Index page) */
const CY_PRESETS = [
  ['Top functions', 'MATCH (f:Function) RETURN f.name, f.file, f.pagerank ORDER BY f.pagerank DESC LIMIT 20'],
  ['Edge types', 'MATCH ()-[r]->() RETURN label(r) AS type, count(*) AS n ORDER BY n DESC'],
  ['Biggest files', 'MATCH (f:File)-[:CONTAINS]->(n) RETURN f.path, count(n) AS symbols ORDER BY symbols DESC LIMIT 20'],
  ['Untested hubs', 'MATCH (f:Function) WHERE NOT EXISTS { MATCH ()-[:TESTS]->(f) } RETURN f.name, f.file, f.pagerank ORDER BY f.pagerank DESC LIMIT 20'],
];
const CY_STATE = {};
function cypherConsole(card, { key, tall = false }) {
  const st = CY_STATE[key] || (CY_STATE[key] = { query: lsGet('docgraph.cypher', '') || CY_PRESETS[0][1], out: null });
  card.innerHTML = `<div class="card-head">${ic('term')} Cypher console <span class="sub">read-only · ${esc(ROOT.slug)}</span></div><div class="card-body">
    <div class="presets">${CY_PRESETS.map(([l], i) => `<button class="chip" data-pre="${i}">${esc(l)}</button>`).join('')}${S.sel && S.sel.kind === 'Function' ? `<button class="chip" data-pre="callers">Callers of ${esc(S.sel.name)}</button>` : ''}</div>
    <textarea class="input" spellcheck="false" style="${tall ? 'height:130px' : ''}">${esc(st.query)}</textarea>
    <div class="row" style="margin:8px 0"><button class="btn primary sm" data-run>${ic('play')} Run</button><span class="faint" style="font-size:11.5px"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span><span class="grow"></span><span class="faint mono" style="font-size:11px" data-meta></span></div>
    <div data-out></div></div>`;
  hydrateIcons(card);
  const ta = $('textarea', card), out = $('[data-out]', card), meta = $('[data-meta]', card);
  const show = () => {
    const o = st.out; if (!o) { out.innerHTML = ''; meta.textContent = ''; return; }
    if (o.loading) { out.innerHTML = loadingHTML('Running…'); return; }
    if (o.error) { out.innerHTML = errorHTML(o.error, false); meta.textContent = ''; return; }
    if (o.rejected) { out.innerHTML = `<div class="err-box">${ic('alert')}<span class="grow">${esc(o.rejected)}</span></div>`; meta.textContent = ''; hydrateIcons(out); return; }
    const rows = o.rows || []; meta.textContent = `${rows.length} row${rows.length === 1 ? '' : 's'} · ${o.ms} ms`;
    if (!rows.length) { out.innerHTML = noneHTML('No rows.'); return; }
    const cols = []; for (const r of rows.slice(0, 50)) for (const k of Object.keys(r)) if (!cols.includes(k)) cols.push(k);
    const cell = v => v == null ? '<span class="faint">null</span>' : esc(typeof v === 'object' ? JSON.stringify(v) : String(v));
    out.innerHTML = `<div class="cy-out"><table class="tbl"><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r => `<tr>${cols.map(c => `<td title="${esc(typeof r[c] === 'object' ? JSON.stringify(r[c]) : r[c])}">${cell(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  };
  const run = async () => {
    st.query = ta.value; lsSet('docgraph.cypher', st.query);
    if (!st.query.trim()) return;
    st.out = { loading: true }; show();
    const t0 = performance.now();
    try { const r = await apiPost('/api/cypher', { query: st.query, limit: 200 }); st.out = { rows: r.rows, rejected: r.rejected, ms: Math.round(performance.now() - t0) }; }
    catch (e) { st.out = { error: e }; }
    if (card.isConnected) show();
  };
  $('[data-run]', card).onclick = run;
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } };
  $('.presets', card).onclick = e => {
    const c = e.target.closest('[data-pre]'); if (!c) return;
    ta.value = c.dataset.pre === 'callers' ? `MATCH (c:Function)-[:CALLS]->(f:Function {name: '${S.sel.name.replace(/'/g, "\\'")}'}) RETURN c.name, c.file, c.line_start ORDER BY c.pagerank DESC LIMIT 50` : CY_PRESETS[+c.dataset.pre][1];
    run();
  };
  show();
}

    toast(body.module ? `Rebuilding ${body.module}…` : 'Wiki build started');

/* ─────────────────────────── Job tracking (shared) ─────────────────────────── */
const TRACKED = new Map(); // job id -> interval
function trackJob(id, type) {
  if (TRACKED.has(id)) return;
  const poll = async () => {
    let j; try { j = await api(`/api/jobs/${q(id)}`, { root: false }); } catch { return; }
    if (j.progress) noteProgress(id, j.progress);
    if (type === 'wiki' && WIKI_JOB && WIKI_JOB.id === id) { WIKI_JOB.status = j.status; WIKI_JOB.error = j.error; drawWikiStatus(); }
    if (j.status !== 'running') {
      clearInterval(TRACKED.get(id)); TRACKED.delete(id);
      const slug = (rootByPath(j.root) || {}).slug;
      if (j.status === 'completed') toast(`${type === 'wiki' ? 'Wiki build' : type === 'fetch' ? 'Link fetch' : 'Index'} finished${slug ? ' · ' + slug : ''}`, 'ok');
      else toast(`${type} ${j.status}${j.error ? ': ' + j.error : ''}`, j.status === 'cancelled' ? '' : 'err');
      if (type === 'wiki' && slug === ROOT.slug) { delete RC.wiki; Object.keys(RC).forEach(k => k.startsWith('wp:') && delete RC[k]); if (S.page === 'wiki') drawWikiNav(); }
      if (type === 'fetch' && S.page === 'index') drawSources();
      refreshStatus();
    }
    if (S.page === 'index') drawJobs();
  };
  TRACKED.set(id, setInterval(poll, 1500)); poll();
}
async function attachRunningJob(type) {
  try {
    const jobs = await api('/api/jobs', { root: false }), ri = rootInfo();
    for (const j of jobs) if (j.status === 'running') {
      trackJob(j.id, j.type);
      if (j.type === 'wiki' && ri && j.root === ri.path) { WIKI_JOB = { id: j.id, slug: ROOT.slug, status: 'running' }; drawWikiStatus(); }
    }
  } catch { /* host unreachable: status pill shows it */ }
}
async function cancelJob(id) {
  try { await apiPost(`/api/jobs/${q(id)}/cancel`, {}, { root: false }); toast('Cancel requested — the job stops at its next checkpoint'); }
  catch (e) { toast('Cancel failed: ' + errText(e), 'err'); }
}

// Sequence diagram: one lifeline per participant (entry first, then BFS order), one arrow per
// call edge ordered by the caller's BFS depth then call line. Capped for readability.
function sequenceSVG(p) {
  const MAXP = 12, MAXM = 45;
  const e = p.entry, depth = new Map([[e.qname, 0]]), name = new Map([[e.qname, e.name]]), file = new Map([[e.qname, e.file]]);
  for (const c of p.chain || []) { depth.set(c.qname, c.depth); name.set(c.qname, c.name); file.set(c.qname, c.file); }
  const order = [e.qname, ...(p.chain || []).slice().sort((a, b) => a.depth - b.depth || (a.line || 0) - (b.line || 0)).map(c => c.qname)];
  const parts = [...new Set(order)];
  const shownP = parts.slice(0, MAXP), idx = new Map(shownP.map((q2, i) => [q2, i]));
  const msgs = (p.edges || []).filter(m => idx.has(m.src) && idx.has(m.dst))
    .sort((a, b) => (depth.get(a.src) ?? 99) - (depth.get(b.src) ?? 99) || (a.line || 0) - (b.line || 0));
  const shownM = msgs.slice(0, MAXM);
  const colW = 150, top = 46, rowH = 30, left = 20;
  const W = left * 2 + shownP.length * colW, H = top + 20 + shownM.length * rowH + 16;
  const cx = (i) => left + i * colW + colW / 2;
  const T = G.T || readTheme();
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sequence diagram">
    <defs><marker id="sq-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${esc(T.accent)}"/></marker></defs>`;
  shownP.forEach((q2, i) => {
    const x = cx(i), nm = String(name.get(q2) || q2.split('::').pop());
    const label = nm.length > 18 ? nm.slice(0, 17) + '…' : nm;
    s += `<line x1="${x}" y1="${top}" x2="${x}" y2="${H - 8}" stroke="${esc(T.faint)}" stroke-dasharray="3 4" stroke-width="1"/>
      <g class="seq-head" data-n="${esc(nm)}" data-f="${esc(file.get(q2) || '')}"><title>${esc(q2)}</title><rect x="${x - colW / 2 + 8}" y="8" width="${colW - 16}" height="28" rx="6" fill="${i === 0 ? hexA(T.accent, .16) : hexA(T.faint, .12)}" stroke="${i === 0 ? esc(T.accent) : hexA(T.faint, .5)}"/>
      <text x="${x}" y="26" text-anchor="middle" font-size="11.5" fill="${esc(T.text)}">${esc(label)}</text></g>`;
  });
  shownM.forEach((m, k) => {
    const a = idx.get(m.src), b = idx.get(m.dst), y = top + 24 + k * rowH;
    const low = m.confidence != null && m.confidence < 0.5;
    const col = low ? T.warn : T.accent;
    const lbl = `${String(name.get(m.dst) || '').slice(0, 20)}${m.line ? ' :' + m.line : ''}${m.confidence != null ? ' (' + Number(m.confidence).toFixed(2) + ')' : ''}`;
    if (a === b) {
      const x = cx(a);
      s += `<path d="M${x} ${y - 6} h26 v12 h-24" fill="none" stroke="${esc(col)}" stroke-width="1.3" marker-end="url(#sq-arr)"/><text x="${x + 32}" y="${y + 4}" font-size="10.5" fill="${esc(T.faint)}">${esc(lbl)}</text>`;
    } else {
      const x1 = cx(a), x2 = cx(b);
      s += `<line x1="${x1}" y1="${y}" x2="${x2 + (x2 > x1 ? -3 : 3)}" y2="${y}" stroke="${esc(col)}" stroke-width="1.3"${low ? ' stroke-dasharray="5 3"' : ''} marker-end="url(#sq-arr)"><title>${esc(m.src)} -> ${esc(m.dst)}${m.method ? ' [' + esc(m.method) + ']' : ''}</title></line>
        <text x="${(x1 + x2) / 2}" y="${y - 5}" text-anchor="middle" font-size="10.5" fill="${esc(T.faint)}">${esc(lbl)}</text>`;
    }
  });
  s += '</svg>';
  const cut = [];
  if (parts.length > MAXP) cut.push(`${parts.length - MAXP} more participant${parts.length - MAXP === 1 ? '' : 's'}`);
  if (msgs.length > MAXM) cut.push(`${msgs.length - MAXM} more call${msgs.length - MAXM === 1 ? '' : 's'}`);
  const hidden = (p.edges || []).length - msgs.length;
  if (hidden > 0) cut.push(`${hidden} call${hidden === 1 ? '' : 's'} to hidden participants`);
  return (shownM.length ? s : `<div class="empty">No call edges between the flow's steps.</div>`) + (cut.length ? `<div class="lod-note" style="padding:6px 10px">Truncated: ${cut.join(', ')}. Dashed amber arrows are low-confidence calls.</div>` : `<div class="lod-note" style="padding:6px 10px">Dashed amber arrows are low-confidence calls (&lt; 0.5).</div>`);
}

  if (ROOT.slug && has(ROOT.slug)) { /* keep */ }
  else if (fromUrl && has(fromUrl)) ROOT.slug = fromUrl;
  else if (stored && has(stored)) ROOT.slug = stored;
  else ROOT.slug = (ROOT.list.find(r => r.default) || ROOT.list[0]).slug;
  renderRootPick();
}
function renderRootPick() {
  const r = rootInfo();
  $('#root-name').textContent = r ? r.slug : '…';
  $('#root-pick').title = r ? `${r.path}${ROOT.list.length > 1 ? ' — click to switch root' : ''}` : 'Active root';
  $('#root-dot').className = 'dot' + (r ? '' : ' idle');
}
function openRootMenu() {
  const rp = $('#root-pick'); let m = $('.root-menu', rp); if (m) { m.remove(); return; }
  if (!ROOT.list.length) return;
  rp.insertAdjacentHTML('beforeend', `<div class="root-menu" role="menu">${ROOT.list.map(r => `<div class="it" data-r="${esc(r.slug)}" role="menuitem"><span class="dot" style="color:${r.slug === ROOT.slug ? 'var(--accent)' : r.last_indexed_at ? 'var(--ok)' : 'var(--faint)'}"></span><div class="grow" style="min-width:0"><div><b>${esc(r.slug)}</b> ${r.default ? '<span class="pill" style="height:16px">default</span>' : ''} ${r.watching ? '<span class="pill ok" style="height:16px">watching</span>' : ''}</div><div class="p ellipsis" title="${esc(r.path)}">${esc(r.path)}</div></div><span class="faint mono" style="font-size:11px" data-files="${esc(r.slug)}">…</span></div>`).join('')}</div>`);
  m = $('.root-menu', rp);
  for (const r of ROOT.list) statsFor(r.slug).then(s => { const el = m.querySelector(`[data-files="${CSS.escape(r.slug)}"]`); if (el) el.textContent = `${fmtNum(s.File)} files`; }).catch(() => { const el = m.querySelector(`[data-files="${CSS.escape(r.slug)}"]`); if (el) el.textContent = ''; });
  $$('.it', m).forEach(it => it.onclick = ev => { ev.stopPropagation(); m.remove(); switchRoot(it.dataset.r); });
}
function switchRoot(slug) {
  if (!slug || slug === ROOT.slug) return;
  ROOT.slug = slug; try { localStorage.setItem('docgraph.root', slug); } catch { /* storage unavailable */ }
  RC = {}; DC = {};
  G.selectedId = null; S.sel = null; G.nb = { id: null, nodes: new Map(), edges: [] }; G.focus = null; G.overlay = null; G.overlayPos.clear(); G.man = null; clearTiles(); S.explore = null; S.search.results = null; S.search.near = false; S.change = null; S.changesRef = ''; S.wiki = null;
  Object.keys(CY_STATE).forEach(k => { CY_STATE[k].out = null; });
  renderRootPick(); renderSelChip(); renderDetail();
  if (S.leftTab === 'files') renderLeft();
  toast('Switched to ' + slug);
  loadGraph(); route();
}

/* ─────────────────────────── Status pill + live events ─────────────────────────── */
function noteProgress(id, d) {
  if (!id || !d) return;
  const p = JOBPROG[id] || (JOBPROG[id] = { phases: [] });
  if (!p.phases) p.phases = [];
  if (d.phase && p.phase !== d.phase) { if (p.phases[p.phases.length - 1] !== d.phase) p.phases.push(d.phase); p.phaseStart = d.ts || Date.now() / 1000; }
  Object.assign(p, { phase: d.phase ?? p.phase, current: d.current ?? p.current, total: d.total ?? p.total, module: d.module ?? p.module });
}
function setIdx(label, cls, live) {
  $('#idx-lbl').textContent = label;
  $('#idx-dot').className = `dot ${cls}${live ? ' live' : ''}`;
}
async function refreshStatus(jobs) {
  try { jobs = jobs || await api('/api/jobs', { root: false }); }
  catch { setIdx('Offline', 'err'); $('#idx-status').title = 'Cannot reach the DocGraph host'; return; }
  const run = jobs.filter(j => j.status === 'running');
  for (const j of run) trackJob(j.id, j.type);
  if (!run.length) { setIdx('Ready', 'ok'); $('#idx-status').title = 'No index / wiki / fetch job running — open the Index page'; return; }
  const j = run.find(x => x.type === 'index') || run[0], p = JOBPROG[j.id] || {};
  const pct = p.total ? Math.min(100, Math.round(p.current / p.total * 100)) : null;
  const slug = (rootByPath(j.root) || {}).slug || '';
  const label = j.type === 'index' ? `Indexing ${pct != null ? pct + '%' : '…'}` : j.type === 'wiki' ? `Wiki ${p.total ? `${p.current}/${p.total}` : '…'}` : 'Fetching links';
  setIdx(label + (run.length > 1 ? ` +${run.length - 1}` : ''), 'busy', true);
  $('#idx-status').title = `${j.type} running on ${slug}${p.phase ? ' · ' + p.phase : ''}`;
}
let EVT = null;
function setupEvents() {
  if (EVT || typeof EventSource === 'undefined') return;
  try { EVT = new EventSource('/api/events'); } catch { return; }
  const parse = (e) => { try { return JSON.parse(e.data || '{}'); } catch { return {}; } };
  EVT.addEventListener('index_progress', e => { const d = parse(e); noteProgress(d.job_id, d); throttledLive(); });
  EVT.addEventListener('wiki_progress', e => { const d = parse(e); noteProgress(d.job_id, d); if (S.page === 'wiki') drawWikiStatus(); throttledLive(); });
  EVT.addEventListener('reindex_done', e => {
    const d = parse(e), slug = d.repo_slug;
    if (slug) delete STATS_BY_SLUG[slug]; else Object.keys(STATS_BY_SLUG).forEach(k => delete STATS_BY_SLUG[k]);
    request('/api/roots', { root: false }).then(r => { if (Array.isArray(r) && r.length) { ROOT.list = r; if (S.page === 'index') drawRoots(); } }).catch(() => {});
    if (slug && ROOT.slug && slug !== ROOT.slug) return;
    const llm = RC.llm; RC = llm ? { llm } : {}; DC = {};
    clearTimeout(setupEvents._t);
    setupEvents._t = setTimeout(() => {
      if (G.status !== 'loading') loadGraph();
      if (S.page === 'graph' && S.sel) renderDetail();
      toast(`${slug || 'Index'} updated — graph reloaded`);
      refreshStatus();
    }, 150);
  });
}
const throttledLive = (() => { let t = 0, pend = false; return () => {
  const now = Date.now(); if (now - t < 500) { if (!pend) { pend = true; setTimeout(() => { pend = false; throttledLive(); }, 500); } return; }
  t = now; refreshStatus(); if (S.page === 'index') { drawJobs(); }
}; })();

/* ─────────────────────────── Theme ─────────────────────────── */
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  $('#theme-btn').innerHTML = ic(dark ? 'sun' : 'moon');
  G.T = readTheme(); restyle();
  if (S.leftTab === 'filters') renderLeft();
}

/* ─────────────────────────── Global wiring ─────────────────────────── */
const ACTS = {
  'left-open': () => toggleLeft(true), 'left-close': () => toggleLeft(false),
  'right-open': () => toggleRight(true),
  'det-close': () => { if (innerWidth > 1180) clearSelection(); else toggleRight(false); },
  'sel-clear': () => clearSelection(),
  'zoom-in': () => zoomBy(1.25), 'zoom-out': () => zoomBy(0.8), 'fit': () => fitToScreen(),
  'pause': () => { if (!G.man) return; G.layoutRunning ? pauseLayout() : startLayout(); },
  'relayout': () => { if (G.man) resetLayout(); },
  'reload-graph': () => loadGraph(), 'graph-retry': () => (ROOT.slug ? loadGraph() : boot()), 'boot': () => boot(),
  'index-now': () => reindex(ROOT.slug, false),
  'ask-about': () => askAboutSelection(),
  'focus': () => { G.focusHops = Math.max(1, G.focusHops); if (G.selectedId != null) loadNeighbors(G.selectedId).then(() => fitToScreen()); if (S.leftTab === 'filters') renderLeft(); toast('Focused on the 1-hop neighbourhood — Filters → Focus depth to change'); },
  'copy-ref': async () => { const s = S.sel; if (!s) return; let ref = selFile() || s.name; if (!isFileSel()) { const d = await loadDef().catch(() => null); ref = d ? `${d.file}:${d.line}` : `${s.file || ''}::${s.name}`; } copyText(ref); },
  'det-tab': (el) => { S.detTab = el.dataset.tab; renderDetail(); },
  'wk-open': () => $('#wk-nav')?.classList.add('open'), 'wk-close': () => $('#wk-nav')?.classList.remove('open'),
  'wiki-build': () => startWikiBuild({}),
  'wiki-rebuild-page': async (el) => { const mod = el.dataset.mod; if (!mod) return; if (await confirmDialog({ title: `Rebuild the ${mod} page?`, body: 'The page is regenerated from the current graph with the configured LLM.', confirmLabel: 'Rebuild' })) startWikiBuild({ module: mod, force: true }); },
  'job-cancel': (el) => cancelJob(el.dataset.job),
  'job-details': (el) => { const row = el.closest('.job'); if (row.dataset.open) { delete row.dataset.open; $('.jd', row).innerHTML = ''; } else showJobDetails(row, el.dataset.job); },
  'reindex': (el) => reindex(el.dataset.slug, !!el.dataset.full),
  'reindex-menu': (el) => popMenu(el, [
    ['Incremental index', () => reindex(el.dataset.slug, false), 'changed files'],
    ['Full rebuild', () => reindex(el.dataset.slug, true), 'wipe + rebuild'],
    ['Cancel running op', () => adminCancel(el.dataset.slug), ''],
    ['Make active', () => switchRoot(el.dataset.slug), ''],
  ]),
  'admin-cancel': () => adminCancel(ROOT.slug),
  'clear-root': async () => {
    const slug = ROOT.slug;
    if (!(await confirmDialog({ title: `Clear the index of ${slug}?`, body: `Deletes <code>${esc((rootInfo() || {}).path || '')}\\.docgraph</code> — graph, embeddings, cache and wiki. Search and the graph are empty until the next index.`, confirmLabel: 'Clear index', danger: true, typeToConfirm: slug }))) return;
    try { await request(`/api/admin/clear?root=${q(slug)}`, { method: 'POST', body: {}, root: false }); toast(`${slug} cleared`, 'ok'); delete STATS_BY_SLUG[slug]; RC = {}; loadGraph(); if (S.page === 'index') MOUNT.index(); }
    catch (e) { toast('Clear failed: ' + errText(e), 'err'); }
  },
  'repo-add': async () => { const v = ($('#repo-add').value || '').trim(); if (!v) return; try { await apiPost('/api/repos', { path: v }); toast('Added — indexed on the next run'); drawSources(); } catch (e) { toast(errText(e), 'err'); } },
  'repo-del': async (el) => { try { await apiDel(`/api/repos?path=${q(el.dataset.path)}`); drawSources(); } catch (e) { toast(errText(e), 'err'); } },
  'link-add': async () => {
    const url = ($('#link-url').value || '').trim(); if (!url) return;
    if (!/^https?:\/\//i.test(url)) { toast('Links must start with http:// or https://', 'err'); return; }
    try { await apiPost('/api/links', { url, depth: +$('#link-depth').value || 0, max_pages: +$('#link-max').value || 0, ttl_hours: +$('#link-ttl').value || 24 }); toast('Link added'); drawSources(); } catch (e) { toast(errText(e), 'err'); }
  },
  'link-del': async (el) => { try { await apiDel(`/api/links?url=${q(el.dataset.url)}`); drawSources(); } catch (e) { toast(errText(e), 'err'); } },
  'link-fetch': async (el) => { try { const r = await apiPost('/api/links/fetch', { url: el.dataset.url, force: true }); toast('Fetching…'); trackJob(r.job_id, 'fetch'); } catch (e) { toast(errText(e), 'err'); } },
  'links-fetch': async (el) => { try { const r = await apiPost('/api/links/fetch', { force: !!el.dataset.force }); toast('Fetching links…'); trackJob(r.job_id, 'fetch'); } catch (e) { toast(errText(e), 'err'); } },
  'ask-new': () => { newThread(); drawThreads(); drawMsgs(); drawCtx(); $('#ask-side')?.classList.remove('open'); $('#ask-in')?.focus(); },
  'ask-ctx': () => openPalette('attach'),
  'ctx-clear': () => { const t = curThread(); if (t) { t.ctx = null; saveAsk(); drawCtx(); } },
  'ask-side-open': () => $('#ask-side')?.classList.add('open'), 'ask-side-close': () => $('#ask-side')?.classList.remove('open'),
  'more-pages': (el) => popMenu(el, MORE_PAGES().map(p => [p[1], () => go(p[0]), ''])),
  'overlay-clear': () => clearOverlay(),
  'open-cluster': (el) => { S.insCluster = Number(el.dataset.cid); go('insights'); },
  'rename-plan': () => planRename(),
  'rename-apply': () => applyRename(),
  'rename-close': () => { S.rename = null; S.detTab = 'overview'; renderDetail(); },
};
async function adminCancel(slug) {
  try { await request(`/api/admin/cancel?root=${q(slug)}`, { method: 'POST', body: {}, root: false }); toast(`Cancel requested for ${slug}`); }
  catch (e) { toast('Cancel failed: ' + errText(e), 'err'); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && ACTS[a.dataset.act] && !a.disabled) { e.preventDefault(); ACTS[a.dataset.act](a, e); }
  if (!e.target.closest('#root-pick')) $('.root-menu')?.remove();
});
$('#root-pick').onclick = e => { if (e.target.closest('.root-menu')) return; e.stopPropagation(); openRootMenu(); };
$('#root-pick').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRootMenu(); } };
$('#idx-status').onclick = () => go('index');
$('#cmd-btn').onclick = () => openPalette();
$('#theme-btn').onclick = () => {
  const cur = document.documentElement.dataset.theme, dark = cur ? cur === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  const t = dark ? 'light' : 'dark'; try { localStorage.setItem('dg-theme', t); } catch { /* storage unavailable */ } applyTheme(t);
};
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (!document.documentElement.dataset.theme) applyTheme(null); });
$('#pal-q').oninput = () => { PAL.sel = 0; const v = $('#pal-q').value.trim(); if (v.length >= 3 && ROOT.slug) palRemote(v); renderPal(); };
$('#pal-q').onkeydown = e => {
  if (e.key === 'ArrowDown') { PAL.sel = Math.min(PAL.sel + 1, PAL.items.length - 1); renderPal(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { PAL.sel = Math.max(PAL.sel - 1, 0); renderPal(); e.preventDefault(); }
  else if (e.key === 'Enter') { e.preventDefault(); palPick(PAL.sel); }
  else if (e.key === 'Escape') closePalette();
};
$('#pal-list').onclick = e => { const it = e.target.closest('.it'); if (it) palPick(+it.dataset.k); };
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  else if (e.key === '/' && !typing) { e.preventDefault(); openPalette(); }
  else if (e.key === 'Escape') {
    if ($('#palette').classList.contains('open')) { closePalette(); return; }
    toggleLeft(false); $('#wk-nav')?.classList.remove('open'); $('#ask-side')?.classList.remove('open'); $$('.menu.pop').forEach(m => m.remove());
    if (S.page === 'graph' && S.sel && !typing) clearSelection();
  }
});
window.addEventListener('resize', () => { markNav(); G.needsRender = true; });
window.addEventListener('hashchange', route);

/* ─────────────────────────── Boot ─────────────────────────── */
let STATUS_TIMER = null, BOOT_RETRY = null;
function initShell() {
  hydrateIcons(); buildNav();
  let saved = null; try { saved = localStorage.getItem('dg-theme'); } catch { /* storage unavailable */ }
  const v = $('#view');
  v.appendChild(buildGraphPage());
  const other = document.createElement('div'); other.id = 'pg-other'; other.className = 'page-host hidden'; v.appendChild(other);
  applyTheme(saved);
  mountGraphPage();
  requestAnimationFrame(tick);
}
async function boot() {
  clearTimeout(BOOT_RETRY); ROOT.error = null;
  setIdx('Connecting…', 'busy');
  try { await loadRoots(); }
  catch (e) {
    ROOT.error = e; setIdx('Offline', 'err');
    setOverlay('error', 'Cannot reach the DocGraph host', esc(errText(e)), '<button class="btn sm primary" data-act="boot">Retry</button>');
    route(); BOOT_RETRY = setTimeout(boot, 6000); return;
  }
  route();
  loadGraph();
  setupEvents();
  refreshStatus();
  if (!STATUS_TIMER) STATUS_TIMER = setInterval(() => refreshStatus(), 4000);
}
initShell();
boot();
</script>
