<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocGraph</title>
  <style>
    :root {
      --bg: #0b0e14;
      --bg-alt: #11141c;
      --panel: #161a23;
      --border: #1f2430;
      --fg: #e6e6e6;
      --fg-dim: #8a93a4;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --warn: #f59e0b;
      --good: #34d399;
      --bad: #fb7185;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { display: grid; grid-template-columns: 320px 1fr 380px; height: 100vh; }
    .pane { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
    .pane:last-child { border-right: 0; border-left: 1px solid var(--border); }
    header.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-alt); }
    header.toolbar h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.02em; color: var(--accent); }
    header.toolbar .grow { flex: 1; }
    header.toolbar .stat { font-size: 11px; color: var(--fg-dim); }
    .search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .search input { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; outline: none; font-size: 13px; }
    .search input:focus { border-color: var(--accent); }
    .filters { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--fg-dim); cursor: pointer; user-select: none; }
    .chip.active { color: var(--accent); border-color: var(--accent); }
    .results { flex: 1; overflow: auto; }
    .result { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .result:hover { background: var(--bg-alt); }
    .result .name { font-weight: 600; color: var(--fg); }
    .result .name .kind { font-size: 10px; padding: 1px 6px; margin-right: 6px; border-radius: 3px; background: var(--accent-2); color: #1a1a2e; }
    .result .name .kind.Function { background: var(--accent); }
    .result .name .kind.Class { background: var(--accent-2); }
    .result .name .kind.File { background: var(--good); }
    .result .meta { font-size: 11px; color: var(--fg-dim); margin-top: 3px; }
    .result .snippet { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace; font-size: 11px; color: var(--fg-dim); margin-top: 6px; max-height: 60px; overflow: hidden; white-space: pre-wrap; }

    #graph { flex: 1; position: relative; background: radial-gradient(ellipse at top left, #131726 0%, #0b0e14 60%); overflow: hidden; }
    #graph canvas { display: block; }

    #detail { padding: 12px; overflow: auto; flex: 1; }
    #detail h2 { margin: 0 0 4px; font-size: 14px; color: var(--accent); }
    #detail .meta { font-size: 11px; color: var(--fg-dim); margin-bottom: 10px; }
    #detail .section { margin-top: 14px; }
    #detail .section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); margin: 0 0 6px; font-weight: 600; }
    #detail pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 11px; overflow: auto; max-height: 280px; margin: 0; font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace; }
    #detail .link { display: block; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    #detail .link:hover { background: var(--bg-alt); color: var(--accent); }
    #detail .link .kind-tag { font-size: 9px; padding: 1px 5px; margin-right: 6px; border-radius: 3px; background: var(--border); color: var(--fg-dim); }
    .empty { padding: 30px 16px; text-align: center; color: var(--fg-dim); font-size: 12px; }
    .legend { position: absolute; top: 10px; right: 10px; background: rgba(11,14,20,0.85); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 11px; backdrop-filter: blur(8px); }
    .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    .legend .swatch { width: 10px; height: 10px; border-radius: 50%; }
    .controls { position: absolute; top: 10px; left: 10px; background: rgba(11,14,20,0.85); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 11px; display: flex; gap: 10px; }
    .controls button { background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .badge { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; font-size: 10px; color: var(--fg-dim); margin-right: 4px; }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--fg-dim); }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT: search + results -->
    <aside class="pane">
      <header class="toolbar">
        <h1>◆ DocGraph</h1>
        <span class="grow"></span>
        <span class="stat" id="stat-summary">…</span>
      </header>
      <div class="search">
        <input id="q" placeholder="Search code (semantic)…" autocomplete="off" />
        <div class="filters">
          <span class="chip active" data-kind="">All</span>
          <span class="chip" data-kind="function">Functions</span>
          <span class="chip" data-kind="class">Classes</span>
        </div>
      </div>
      <div class="results" id="results">
        <div class="empty">Type to search.<br/>Or click a node in the graph.</div>
      </div>
    </aside>

    <!-- CENTER: graph -->
    <main class="pane">
      <div id="graph">
        <div class="controls">
          <button id="reset-view">Reset</button>
          <button id="reload-graph">Reload</button>
        </div>
        <div class="legend">
          <div class="row"><span class="swatch" style="background: #7dd3fc"></span>Function</div>
          <div class="row"><span class="swatch" style="background: #a78bfa"></span>Class</div>
          <div class="row"><span class="swatch" style="background: #34d399"></span>File</div>
          <div class="row" style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px"><span style="color:var(--fg-dim)">size = pagerank</span></div>
        </div>
        <div class="loading" id="loading">Loading graph…</div>
      </div>
    </main>

    <!-- RIGHT: detail -->
    <aside class="pane">
      <header class="toolbar">
        <h1>Detail</h1>
        <span class="grow"></span>
        <span class="stat" id="detail-source"></span>
      </header>
      <div id="detail">
        <div class="empty">Select an entity to inspect.</div>
      </div>
    </aside>
  </div>

  <script type="module">
    // Very small force-directed canvas renderer (no deps).
    // Sufficient for ~2k nodes, looks great. For 50k+ we'd swap in cosmograph.
    const $ = (s) => document.querySelector(s);
    const api = (path) => fetch(path).then(r => r.json());
    const el = (tag, props = {}, ...children) => {
      const e = document.createElement(tag);
      Object.assign(e, props);
      for (const c of children) e.append(c.nodeType ? c : document.createTextNode(c));
      return e;
    };

    let graph = { nodes: [], edges: [] };
    let layout = []; // [{id, x, y, vx, vy, r, color, kind, name}]
    let layoutById = new Map();
    let canvas, ctx, viewport = { tx: 0, ty: 0, scale: 1 };
    let selectedId = null, hoverId = null, dragging = null;

    const COLORS = { Function: "#7dd3fc", Class: "#a78bfa", File: "#34d399" };

    async function loadStats() {
      const s = await api("/api/stats");
      $("#stat-summary").textContent = `${s.File||0} files · ${s.Function||0} fn · ${s.Class||0} cls`;
    }

    async function loadGraph() {
      $("#loading").style.display = "";
      graph = await api("/api/graph?limit_nodes=1500");
      buildLayout();
      $("#loading").style.display = "none";
      render();
    }

    function buildLayout() {
      const N = graph.nodes.length;
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const maxPR = Math.max(0.0001, ...graph.nodes.map(n => n.pagerank || 0));
      layout = graph.nodes.map((n, i) => {
        const angle = (i / N) * Math.PI * 2;
        const r0 = 200 + Math.random() * 200;
        return {
          id: n.id,
          name: n.name,
          kind: n.kind,
          file: n.file,
          x: cx + Math.cos(angle) * r0,
          y: cy + Math.sin(angle) * r0,
          vx: 0, vy: 0,
          r: 3 + Math.sqrt((n.pagerank || 0) / maxPR) * 14,
          color: COLORS[n.kind] || "#888",
          pagerank: n.pagerank || 0,
        };
      });
      layoutById = new Map(layout.map(n => [n.id, n]));
    }

    // --- Force-directed simulation (Barnes-Hut-ish but cheap) ---
    function step() {
      const REPULSE = 800;
      const SPRING = 0.012;
      const SPRING_LEN = 80;
      const CENTER = 0.0008;
      const FRICTION = 0.86;
      const cx = canvas.width / 2, cy = canvas.height / 2;

      // Repulsion: O(N^2) — fine up to ~2k nodes
      for (let i = 0; i < layout.length; i++) {
        const a = layout[i];
        let fx = (cx - a.x) * CENTER;
        let fy = (cy - a.y) * CENTER;
        for (let j = 0; j < layout.length; j++) {
          if (i === j) continue;
          const b = layout[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d2 = dx*dx + dy*dy + 0.01;
          const f = REPULSE / d2;
          fx += dx * f / Math.sqrt(d2);
          fy += dy * f / Math.sqrt(d2);
        }
        a.fx = fx; a.fy = fy;
      }
      // Springs
      for (const e of graph.edges) {
        const a = layoutById.get(e.src), b = layoutById.get(e.dst);
        if (!a || !b) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx*dx + dy*dy) + 0.01;
        const f = (d - SPRING_LEN) * SPRING;
        a.fx += dx / d * f;
        a.fy += dy / d * f;
        b.fx -= dx / d * f;
        b.fy -= dy / d * f;
      }
      for (const a of layout) {
        if (a === dragging) continue;
        a.vx = (a.vx + a.fx) * FRICTION;
        a.vy = (a.vy + a.fy) * FRICTION;
        a.x += a.vx;
        a.y += a.vy;
      }
    }

    // --- Render ---
    function render() {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "rgba(11,14,20,1)";
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(viewport.tx, viewport.ty);
      ctx.scale(viewport.scale, viewport.scale);

      // Edges
      const EDGE_COLORS = {
        CALLS: "rgba(125,211,252,0.30)",
        INHERITS: "rgba(167,139,250,0.50)",
        REFERENCES_: "rgba(255,255,255,0.10)",
        IMPORTS: "rgba(52,211,153,0.20)",
        SIMILAR_TO: "rgba(251,113,133,0.18)",
        TESTS: "rgba(245,158,11,0.30)",
        CO_CHANGED_WITH: "rgba(255,255,255,0.06)",
      };
      ctx.lineWidth = 0.6;
      for (const e of graph.edges) {
        const a = layoutById.get(e.src), b = layoutById.get(e.dst);
        if (!a || !b) continue;
        ctx.strokeStyle = EDGE_COLORS[e.kind] || "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      // Highlighted edges from selected node
      if (selectedId !== null) {
        ctx.lineWidth = 1.4;
        for (const e of graph.edges) {
          if (e.src !== selectedId && e.dst !== selectedId) continue;
          const a = layoutById.get(e.src), b = layoutById.get(e.dst);
          if (!a || !b) continue;
          ctx.strokeStyle = EDGE_COLORS[e.kind] || "#fff";
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
      // Nodes
      for (const n of layout) {
        ctx.fillStyle = n.color;
        ctx.globalAlpha = (selectedId !== null && n.id !== selectedId) ? 0.35 : 1.0;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
        if (n.id === selectedId || n.id === hoverId) {
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#fff";
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
      }
      // Labels for top PR or hovered/selected
      ctx.fillStyle = "#e6e6e6";
      ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
      const sortedByPR = [...layout].sort((a,b)=>b.pagerank-a.pagerank).slice(0, 30);
      for (const n of sortedByPR) {
        ctx.fillText(n.name, n.x + n.r + 3, n.y + 3);
      }
      if (hoverId !== null) {
        const n = layoutById.get(hoverId);
        if (n) {
          ctx.fillStyle = "#fff";
          ctx.fillText(n.name, n.x + n.r + 3, n.y + 3);
        }
      }
      ctx.restore();
    }

    function tick() {
      step();
      render();
      requestAnimationFrame(tick);
    }

    function nodeAt(px, py) {
      const wx = (px - viewport.tx) / viewport.scale;
      const wy = (py - viewport.ty) / viewport.scale;
      let best = null, bestD = 1e9;
      for (const n of layout) {
        const dx = n.x - wx, dy = n.y - wy;
        const d = dx*dx + dy*dy;
        if (d < (n.r + 4) * (n.r + 4) && d < bestD) {
          best = n; bestD = d;
        }
      }
      return best;
    }

    function setupCanvas() {
      const host = $("#graph");
      canvas = document.createElement("canvas");
      host.appendChild(canvas);
      ctx = canvas.getContext("2d");
      const resize = () => {
        const rect = host.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        viewport.tx = canvas.width / 2;
        viewport.ty = canvas.height / 2;
      };
      resize();
      window.addEventListener("resize", () => { resize(); });

      let mouseDown = false, lastX = 0, lastY = 0, downAt = 0;
      canvas.addEventListener("mousedown", (e) => {
        mouseDown = true; lastX = e.clientX; lastY = e.clientY; downAt = Date.now();
        const n = nodeAt(e.offsetX, e.offsetY);
        if (n) dragging = n;
      });
      canvas.addEventListener("mouseup", (e) => {
        mouseDown = false;
        const elapsed = Date.now() - downAt;
        if (elapsed < 250 && dragging) {
          select(dragging.id);
        }
        dragging = null;
      });
      canvas.addEventListener("mousemove", (e) => {
        if (mouseDown) {
          const dx = e.clientX - lastX, dy = e.clientY - lastY;
          if (dragging) {
            dragging.x += dx / viewport.scale;
            dragging.y += dy / viewport.scale;
            dragging.vx = 0; dragging.vy = 0;
          } else {
            viewport.tx += dx;
            viewport.ty += dy;
          }
          lastX = e.clientX; lastY = e.clientY;
        } else {
          const n = nodeAt(e.offsetX, e.offsetY);
          hoverId = n ? n.id : null;
          canvas.style.cursor = n ? "pointer" : "default";
        }
      });
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        const wx = (e.offsetX - viewport.tx) / viewport.scale;
        const wy = (e.offsetY - viewport.ty) / viewport.scale;
        viewport.scale *= factor;
        viewport.tx = e.offsetX - wx * viewport.scale;
        viewport.ty = e.offsetY - wy * viewport.scale;
      }, { passive: false });
    }

    async function search(q, kind) {
      const url = `/api/search?q=${encodeURIComponent(q)}&limit=25` + (kind ? `&kind=${kind}` : "");
      const data = await api(url);
      const r = $("#results");
      r.innerHTML = "";
      if (!data.length) {
        r.appendChild(el("div", { className: "empty" }, "No matches."));
        return;
      }
      for (const x of data) {
        const node = el("div", { className: "result" },
          el("div", { className: "name", innerHTML: `<span class="kind ${x.label}">${x.label}</span>${x.name}` }),
          el("div", { className: "meta" }, `${x.file}:${x.line} · score ${x.score.toFixed(2)} · pr ${x.pagerank.toFixed(4)}`),
          el("div", { className: "snippet" }, x.snippet || ""),
        );
        node.onclick = () => select(x.id, x.name);
        r.appendChild(node);
      }
    }

    async function select(id, name) {
      selectedId = id;
      const n = layoutById.get(id);
      const sym = name || (n && n.name);
      if (!sym) return;
      $("#detail-source").textContent = n ? n.kind : "";
      const detail = $("#detail");
      detail.innerHTML = "<div class='empty'>Loading…</div>";
      const [defn, refs, neigh] = await Promise.all([
        api(`/api/definition?name=${encodeURIComponent(sym)}`),
        api(`/api/references?name=${encodeURIComponent(sym)}`),
        api(`/api/neighborhood?name=${encodeURIComponent(sym)}&limit=15`),
      ]);
      detail.innerHTML = "";
      const d = defn[0];
      if (d) {
        detail.appendChild(el("h2", {}, sym));
        detail.appendChild(el("div", { className: "meta" }, `${d.label} · ${d.file}:${d.line}`));
        detail.appendChild(section("Definition", el("pre", {}, (d.body || "").slice(0, 4000))));
      } else {
        detail.appendChild(el("h2", {}, sym));
      }
      if (refs.length) {
        const list = el("div");
        for (const r of refs.slice(0, 30)) {
          const li = el("div", { className: "link" },
            el("span", { className: "kind-tag" }, r.edge),
            `${r.caller || '?'} · ${r.file}:${r.line}`
          );
          li.onclick = () => searchByName(r.caller);
          list.appendChild(li);
        }
        detail.appendChild(section(`References (${refs.length})`, list));
      }
      if (neigh.length) {
        const list = el("div");
        for (const r of neigh) {
          const li = el("div", { className: "link" },
            el("span", { className: "kind-tag" }, r.via),
            `${r.name} · ${r.file}:${r.line}`
          );
          li.onclick = () => select(null, r.name);
          list.appendChild(li);
        }
        detail.appendChild(section("Related", list));
      }
    }

    function section(title, body) {
      const s = el("div", { className: "section" });
      s.appendChild(el("h3", {}, title));
      s.appendChild(body);
      return s;
    }

    function searchByName(name) {
      $("#q").value = name;
      search(name, currentKind);
    }

    let currentKind = "";
    function setupSearch() {
      const q = $("#q");
      let timer;
      q.addEventListener("input", () => {
        clearTimeout(timer);
        const v = q.value.trim();
        if (!v) { $("#results").innerHTML = "<div class='empty'>Type to search.</div>"; return; }
        timer = setTimeout(() => search(v, currentKind), 200);
      });
      document.querySelectorAll(".chip").forEach(c => {
        c.onclick = () => {
          document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
          c.classList.add("active");
          currentKind = c.dataset.kind;
          if (q.value.trim()) search(q.value.trim(), currentKind);
        };
      });
    }

    function setupControls() {
      $("#reset-view").onclick = () => {
        viewport.tx = canvas.width / 2;
        viewport.ty = canvas.height / 2;
        viewport.scale = 1;
        for (const n of layout) {
          n.vx = 0; n.vy = 0;
          n.x = canvas.width/2 + (Math.random() - 0.5) * 400;
          n.y = canvas.height/2 + (Math.random() - 0.5) * 400;
        }
      };
      $("#reload-graph").onclick = () => loadGraph();
    }

    setupCanvas();
    setupSearch();
    setupControls();
    loadStats();
    loadGraph().then(tick);
  </script>
</body>
</html>
